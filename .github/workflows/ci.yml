name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: "true"

      - name: Install packages
        run: lune run install

      - name: Check (license, theme, merge, format, style, lint, types, tests, build)
        run: lune run check

      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: build/quarry-tailwind.rbxm
